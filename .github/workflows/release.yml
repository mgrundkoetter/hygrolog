name: Release

# Builds installers for macOS, Windows and Linux and publishes them as a GitHub release.
# Trigger: bump the version (package.json, src-tauri/tauri.conf.json, src-tauri/Cargo.toml),
# then push a matching tag: git tag v0.1.0 && git push --tags
# A manual run (workflow_dispatch) releases the version currently in tauri.conf.json.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in src-tauri/tauri.conf.json"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # __VERSION__ is replaced by tauri-action with the version from tauri.conf.json.
          tagName: v__VERSION__
          releaseName: 'Hygrolog v__VERSION__'
          releaseBody: |
            Downloads for macOS (.dmg, Apple Silicon and Intel), Windows (.msi / .exe) and Linux (.AppImage / .deb).
            The packages are unsigned; see the README for how to open them the first time.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
